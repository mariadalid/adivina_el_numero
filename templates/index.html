<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego: Adivina el Número</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            color: #333;
        }
        form {
            margin: 20px;
        }
        input[type=number] {
            padding: 10px;
            width: 150px;
            font-size: 16px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        .info {
            margin-top: 20px;
            font-size: 18px;
            color: #444;
        }
    </style>
</head>
<body>
    <h1>Adivina el número (1 - 100)</h1>
    <form action="/adivinar" method="post">
        <input type="number" name="numero" min="1" max="100" required>
        <button type="submit">Adivinar</button>
    </form>
    <div class="info">
        {% if mensaje %}<p>{{ mensaje }}</p>{% endif %}
        <p>Puntos: {{ puntos }}</p>
        <p>Intentos: {{ intentos }}</p>
    </div>
    <a href="/reiniciar"><button>Reiniciar Juego</button></a>
</body>
</html>
